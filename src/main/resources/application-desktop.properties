# Desktop mode runs Spring Boot locally, managed by the Electron application.
# Values can be changed in %APPDATA%\Mercantile\.env without rebuilding the app.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/auradev_erp}
spring.datasource.username=${DB_USERNAME:auradev}
spring.datasource.password=${DB_PASSWORD:auradev_local}

app.jwt.secret=${JWT_SECRET:desktop-local-secret-change-before-client-delivery-32-chars}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:13000}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://127.0.0.1:18080}

spring.jpa.show-sql=false
management.endpoint.health.show-details=always
logging.level.root=INFO
logging.level.com.auradev.erp=INFO
